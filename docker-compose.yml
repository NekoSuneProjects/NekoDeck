services:
  nekodeck:
    build: .
    image: ghcr.io/nekosuneprojects/nekodeck:latest
    container_name: nekodeck
    restart: unless-stopped
    ports:
      - "3210:3210"
    environment:
      HOST: 0.0.0.0
      PORT: 3210
      NEKODECK_DATA_DIR: /data
      # Strongly recommended when exposing beyond localhost:
      # NEKODECK_API_TOKEN: change-me
      # Optional fixed encryption secret (otherwise /data/master.key is generated):
      # NEKODECK_MASTER_KEY: change-me-too
    volumes:
      - ./data:/data
